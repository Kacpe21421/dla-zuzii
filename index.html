<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dla Zuzi ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Pływające serduszka w tle */
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
        .heart-bg {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            animation: animate 25s linear infinite;
            bottom: -150px;
            transform: rotate(45deg);
        }
        .heart-bg::before, .heart-bg::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }
        .heart-bg::before { top: -10px; left: 0; }
        .heart-bg::after { left: -10px; top: 0; }

        @keyframes animate {
            0% { transform: translateY(0) rotate(45deg); opacity: 1; border-radius: 0; }
            100% { transform: translateY(-1000px) rotate(725deg); opacity: 0; border-radius: 50%; }
        }

        /* Koperta i list */
        .card-container {
            z-index: 10;
            perspective: 1000px;
        }
        .envelope {
            width: 300px;
            height: 200px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 0 0 10px 10px;
            position: relative;
            cursor: pointer;
            transition: transform 0.5s;
        }
        .envelope:hover {
            transform: translateY(-5px);
        }
        .front {
            position: absolute;
            width: 0; height: 0;
            border-right: 150px solid #f4f5f7;
            border-left: 150px solid #f4f5f7;
            border-top: 100px solid transparent;
            border-bottom: 100px solid #e1e4e8;
            bottom: 0;
            left: 0;
            z-index: 3;
            border-radius: 0 0 10px 10px;
        }
        .top-flap {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-top: 100px solid #ff4b6e;
            transform-origin: top;
            transition: transform 0.4s ease;
            z-index: 4;
        }
        .envelope.open .top-flap {
            transform: rotateX(180deg);
            z-index: 1;
        }
        .letter {
            position: absolute;
            background: #fffdf6;
            width: 270px;
            height: 170px;
            left: 15px;
            bottom: 10px;
            transition: transform 0.6s ease-in-out;
            z-index: 2;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 5px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .envelope.open .letter {
            transform: translateY(-130px);
            z-index: 5;
            height: auto;
            min-height: 250px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff4b6e;
            font-size: 24px;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 15px;
            line-height: 1.5;
            margin: 0;
        }
        .heart-seal {
            position: absolute;
            top: 80px; left: 135px;
            width: 30px; height: 30px;
            background: #ff4b6e;
            transform: rotate(45deg);
            z-index: 5;
            transition: opacity 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .heart-seal::before, .heart-seal::after {
            content: '';
            position: absolute;
            width: 30px; height: 30px;
            background: #ff4b6e;
            border-radius: 50%;
        }
        .heart-seal::before { top: -15px; left: 0; }
        .heart-seal::after { left: -15px; top: 0; }
        .envelope.open .heart-seal {
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- Animowane tło -->
    <div class="hearts">
        <div class="heart-bg" style="left: 10%; width: 30px; height: 30px; animation-delay: 0s;"></div>
        <div class="heart-bg" style="left: 25%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 12s;"></div>
        <div class="heart-bg" style="left: 70%; width: 20px; height: 20px; animation-delay: 4s;"></div>
        <div class="heart-bg" style="left: 40%; width: 40px; height: 40px; animation-delay: 0s; animation-duration: 18s;"></div>
        <div class="heart-bg" style="left: 85%; width: 25px; height: 25px; animation-delay: 7s;"></div>
    </div>

    <!-- Interaktywna koperta -->
    <div class="card-container">
        <div class="envelope" onclick="openEnvelope(this)">
            <div class="top-flap"></div>
            <div class="heart-seal"></div>
            <div class="front"></div>
            <div class="letter">
                <h1>Dla Zuzi ❤️</h1>
                <!-- Tutaj możesz wpisać swój własny tekst, Zuzia zobaczy go po otwarciu listu -->
                <p>Chciałem Ci po prostu powiedzieć, że jesteś dla mnie bardzo ważna i cieszę się, że jesteś. Mam nadzieję, że ta niespodzianka wywoła uśmiech na Twojej twarzy! 🥰</p>
            </div>
        </div>
    </div>

    <script>
        function openEnvelope(envelope) {
            envelope.classList.toggle('open');
        }
    </script>
</body>
</html>
